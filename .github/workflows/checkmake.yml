---
# yamllint disable rule:line-length
name: checkmake
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: checkmake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkmake:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: Uno-Takashi/checkmake-action@v2
